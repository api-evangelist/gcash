apis:
- name: GCash Mini Program Open API
  description: >-
    Merchant-facing payment API for GCash mini programs — cashier payment,
    payment inquiry, refund and refund inquiry, plus OAuth2 user authorization
    (authCode -> applyToken). Signed requests (Client-Id + Request-Time +
    Signature), idempotent on paymentRequestId/refundRequestId, with async
    notification callbacks.
