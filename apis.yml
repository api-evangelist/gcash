aid: gcash
name: GCash
description: >-
  GCash (operated by Mynt / G-Xchange, Inc.) is the Philippines' largest mobile
  wallet and e-money platform, offering payments, transfers, QR checkout, bills
  payment, savings, lending and insurance to tens of millions of users. For
  developers and businesses it exposes a partner-gated API surface: the GCash
  API Portal (discover and subscribe to API products such as In-Store QR,
  Webpay, GLife and Funds Disbursement) and the GCash Mini Program Open API,
  which lets merchants build in-app mini programs with cashier payments, refunds
  and user authorization. API requests are secured with per-request RSA256/ECC224
  signatures plus an OAuth2 authorization-code user flow, with idempotent payment
  operations and asynchronous webhook notifications. This profile was seeded as a
  portfolio lead and enriched from GCash's public developer documentation.
